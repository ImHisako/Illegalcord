packages:
    - packages/*
peerDependencyRules:
    ignoreMissing:
        - eslint-plugin-import
        - eslint
allowedDeprecatedVersions:
    source-map-resolve: "*"
    resolve-url: "*"
    source-map-url: "*"
    urix: "*"
    q: "*"
strictPeerDependencies: false
overrides:
    brace-expansion: 5.0.8
    dompurify: 3.4.12
    fast-uri@3.1.3: 3.1.4
    flatted@3.3.3: 3.4.2
    minimatch@3.1.2: 3.1.4
    minimatch@9.0.5: 9.0.7
    picomatch@2.3.1: 2.3.2
    picomatch@4.0.3: 4.0.4
    postcss@8.5.16: 8.5.18
allowBuilds:
    esbuild: true
pmOnFail: warn
verifyDepsBeforeRun: prompt
minimumReleaseAgeExclude:
    - "@song-spotlight/api@2.2.0"
